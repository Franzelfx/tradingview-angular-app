<div class="header">
  <!-- Sidebar Toggle Button -->
  <button 
    (click)="onToggleSidebar()" 
    class="icon-button" 
    aria-label="Toggle Sidebar">
    <i
      class="fas"
      [ngClass]="isSidebarVisible ? 'fa-chevron-left' : 'fa-chevron-right'"
      aria-hidden="true">
    </i>
  </button>

  <!-- ASCII Art Logo in the Center -->
  <div class="logo-container">
    <pre class="ascii-art">
███████╗███████╗███████╗
██╔════╝██╔════╝██╔════╝
█████╗  █████╗  █████╗  
██╔══╝  ██╔══╝  ██╔══╝  
██║     ██║     ███████╗
╚═╝     ╚═╝     ╚══════╝
    </pre>
  </div>

  <!-- Logout Button with Icon -->
  <button 
    class="logout-button" 
    aria-label="Logout" 
    (click)="onLogout()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>
</div>
