# Minimal, fast SPA server for the legacy Angular app container
user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # gzip for common text assets
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
      text/plain
      text/css
      text/javascript
      application/javascript
      application/json
      application/xml
      image/svg+xml
      font/woff2;

  # Access log is fine to keep defaults; comment out to reduce IO
  # access_log off;

  server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Health endpoint (optional)
    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Long cache for static assets (Angular filenames are content-hashed)
    location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Prevent caching of the SPA shell so deploys show up immediately
    location = /index.html {
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
      try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-routed paths
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
